[project]
name = "sumer-reel-forge-tts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro-onnx==0.6.1",
  "soundfile==0.13.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.16.3"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
