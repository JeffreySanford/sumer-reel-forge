[project]
name = "sumer-reel-forge-chatterbox"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chatterbox-tts==0.1.7",
  "setuptools==83.0.0",
  "soundfile==0.13.1",
  "torch==2.6.0+cu124",
  "torchaudio==2.6.0+cu124",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
