services:
  api:
    image: node:22-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm nx serve api --host 0.0.0.0"
    environment:
      PORT: 3000
      WEB_ORIGIN: http://localhost:4200
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace

  web:
    image: node:22-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm nx serve web --host 0.0.0.0"
    ports:
      - '4200:4200'
    volumes:
      - .:/workspace
    depends_on:
      - api
