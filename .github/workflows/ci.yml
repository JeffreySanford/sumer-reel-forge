name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sumer_reel_forge
          POSTGRES_PASSWORD: sumer_reel_forge
          POSTGRES_USER: sumer_reel_forge
        options: >-
          --health-cmd "pg_isready -U sumer_reel_forge -d sumer_reel_forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://sumer_reel_forge:sumer_reel_forge@localhost:5432/sumer_reel_forge
      HOST: localhost
      WEB_ORIGIN: http://localhost:4200
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Prepare database
        run: pnpm db:prepare

      - name: Lint, test, and build
        run: pnpm quality

      - name: API end-to-end tests
        timeout-minutes: 5
        run: pnpm e2e:api

      - name: Build Storybook
        timeout-minutes: 5
        run: pnpm storybook:build

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps

      - name: End-to-end tests
        timeout-minutes: 10
        run: pnpm e2e
