name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality / API / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sumer_reel_forge
          POSTGRES_PASSWORD: sumer_reel_forge
          POSTGRES_USER: sumer_reel_forge
        options: >-
          --health-cmd "pg_isready -U sumer_reel_forge -d sumer_reel_forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: true
      NX_DAEMON: false
      PLANNING_PROVIDER: deterministic
      DATABASE_URL: postgresql://sumer_reel_forge:sumer_reel_forge@localhost:5432/sumer_reel_forge
      HOST: localhost
      WEB_ORIGIN: http://localhost:4200
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.15"
          enable-cache: true
          cache-dependency-glob: tools/tts/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace dependency graph
        run: pnpm workspace:check

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Prepare database
        run: pnpm db:prepare

      - name: Lint
        run: pnpm lint

      - name: Unit and creative tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: API end-to-end tests
        timeout-minutes: 5
        run: pnpm e2e:api

      - name: Build Angular Studio Storybook
        timeout-minutes: 5
        run: pnpm storybook:build

      - name: Build React Forge Storybook
        timeout-minutes: 5
        run: pnpm exec nx build-storybook animation-lab

      - name: Install Playwright browsers and Linux dependencies
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: React Forge Storybook interaction tests
        timeout-minutes: 10
        run: pnpm exec nx test-storybook animation-lab --ci

      - name: Angular Studio browser end-to-end tests
        timeout-minutes: 10
        run: pnpm e2e:ci

      - name: React Forge browser end-to-end tests
        timeout-minutes: 10
        run: pnpm exec playwright test --config=apps/animation-lab-e2e/playwright.config.mts --project=chromium --project=firefox

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            dist/.playwright/apps/web/playwright-report
            dist/.playwright/apps/web/test-output
            dist/.playwright/apps/animation-lab-e2e/playwright-report
            dist/.playwright/apps/animation-lab-e2e/test-output
          if-no-files-found: ignore
          retention-days: 7
